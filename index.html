<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>💗 诗凡 & 智杰 · 爱意课表</title>
  <!-- 浪漫粉嫩风格 + 可爱字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #ffe9f4 0%, #ffd9e8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Quicksand', 'PingFang SC', 'Segoe UI', sans-serif;
      padding: 16px 12px 30px;
      position: relative;
    }

    /* 主卡片 – 粉嘟嘟毛玻璃 */
    .love-card {
      max-width: 420px;
      width: 100%;
      background: rgba(255, 240, 245, 0.7);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 48px 48px 36px 36px;
      box-shadow: 0 20px 40px rgba(255, 120, 160, 0.25),
                  0 8px 20px rgba(255, 80, 130, 0.15),
                  inset 0 1px 4px rgba(255, 255, 255, 0.7);
      padding: 24px 20px 28px;
      border: 1px solid rgba(255, 220, 235, 0.6);
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    /* 可爱小装饰 */
    .love-card::before {
      content: "🌸";
      position: absolute;
      top: -6px;
      right: 10px;
      font-size: 40px;
      opacity: 0.3;
      transform: rotate(12deg);
    }
    .love-card::after {
      content: "💕";
      position: absolute;
      bottom: 10px;
      left: 8px;
      font-size: 36px;
      opacity: 0.2;
      transform: rotate(-8deg);
    }

    /* 头部：头像 + 名字 左诗凡 右智杰 */
    .header-avatars {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding: 0 4px;
      position: relative;
      z-index: 2;
    }

    .avatar-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .avatar-block span {
      font-size: 14px;
      font-weight: 600;
      color: #a05070;
      letter-spacing: 1px;
      background: rgba(255, 220, 235, 0.5);
      padding: 2px 12px;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 200, 215, 0.5);
    }

    .avatar-img {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ffb0c8;
      box-shadow: 0 6px 14px rgba(255, 100, 150, 0.3);
      background: #ffe2ed;
      transition: transform 0.25s ease;
      display: block;
    }
    .avatar-img:hover {
      transform: scale(1.02);
    }

    /* 中间 日期 + 爱心 */
    .date-couple {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: -4px;
    }

    .heart-icon {
      font-size: 28px;
      line-height: 1;
      color: #ff4975;
      text-shadow: 0 0 12px rgba(255, 70, 120, 0.5);
      margin-bottom: 2px;
      animation: floatHeart 2.8s ease-in-out infinite;
    }

    .date-badge {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px);
      padding: 6px 18px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 17px;
      color: #822e4b;
      border: 1px solid rgba(255, 200, 215, 0.7);
      box-shadow: 0 4px 10px rgba(255, 130, 170, 0.15);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .date-badge small {
      font-weight: 400;
      font-size: 14px;
      color: #b05a78;
    }

    /* 课表卡片 */
    .schedule-box {
      margin-top: 20px;
      background: rgba(255, 245, 248, 0.5);
      backdrop-filter: blur(6px);
      border-radius: 40px;
      padding: 16px 14px 12px;
      border: 1px solid rgba(255, 200, 215, 0.5);
      box-shadow: inset 0 2px 8px rgba(255, 200, 215, 0.3);
    }

    .schedule-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0 6px 8px 6px;
      font-weight: 600;
      color: #8f3d5a;
      border-bottom: 2px dashed #ffb8ce;
    }
    .schedule-title .day {
      font-size: 16px;
      background: #ffd9e6;
      padding: 0 16px;
      border-radius: 30px;
      color: #7a2d48;
    }
    .schedule-title .week {
      font-size: 14px;
      background: #ffe2ed;
      padding: 0 14px;
      border-radius: 30px;
      color: #a04968;
    }

    .lesson-item {
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(2px);
      border-radius: 30px;
      padding: 12px 16px;
      border-left: 6px solid #ff85aa;
      box-shadow: 0 6px 14px rgba(255, 120, 160, 0.12);
      transition: 0.15s;
    }
    .lesson-item:last-of-type {
      margin-bottom: 6px;
    }

    .lesson-time {
      font-weight: 700;
      color: #b34166;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .lesson-time span {
      background: #ffd0df;
      padding: 2px 12px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      color: #7d2c47;
    }
    .lesson-name {
      font-size: 19px;
      font-weight: 700;
      color: #3c1e2b;
      margin: 4px 0 2px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .lesson-name .icon-emoji {
      font-size: 22px;
    }
    .lesson-meta {
      font-size: 15px;
      color: #5a3a47;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 16px;
      margin-top: 4px;
      background: rgba(255, 220, 235, 0.3);
      padding: 4px 12px 4px 8px;
      border-radius: 40px;
    }
    .lesson-meta i {
      font-style: normal;
      background: #ffc1d4;
      padding: 0 10px;
      border-radius: 20px;
      font-size: 13px;
      color: #682f45;
    }

    .footnote-love {
      text-align: center;
      margin-top: 22px;
      font-size: 18px;
      color: #b34d6e;
      letter-spacing: 2px;
      font-weight: 600;
      background: rgba(255, 200, 215, 0.25);
      padding: 8px 12px;
      border-radius: 60px;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255, 150, 180, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .footnote-love small {
      font-weight: 400;
      font-size: 16px;
    }

    /* 动画 */
    @keyframes floatHeart {
      0% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.1) translateY(-4px); }
      100% { transform: scale(1) translateY(0); }
    }

    /* 音乐播放器小按钮 – 可爱 */
    .music-player {
      position: fixed;
      bottom: 18px;
      right: 18px;
      background: rgba(255, 200, 215, 0.8);
      backdrop-filter: blur(8px);
      width: 52px;
      height: 52px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #6d2a44;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 18px rgba(255, 100, 150, 0.25);
      cursor: pointer;
      transition: 0.2s;
      z-index: 999;
      user-select: none;
    }
    .music-player:active {
      transform: scale(0.9);
    }

    /* 适配小屏 */
    @media (max-width: 380px) {
      .avatar-img { width: 60px; height: 60px; }
      .date-badge { font-size: 15px; padding: 4px 12px; }
    }
  </style>
</head>
<body>

<div class="love-card" id="app">
  <!-- 头像区：左边 陈诗凡 (1.jpg) 右边 张智杰 (2.jpg) -->
  <div class="header-avatars">
    <div class="avatar-block">
      <img class="avatar-img" src="1.jpg" alt="陈诗凡" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23ffb8ce%22/%3E%3Ctext x=%2230%22 y=%2260%22 font-size=%2240%22 fill=%22%236d2a44%22 font-family=%22sans-serif%22%3E🌸%3C/text%3E%3C/svg%3E'">
      <span>✨ 诗凡</span>
    </div>

    <!-- 中央：日期 + 爱心 -->
    <div class="date-couple">
      <div class="heart-icon">💗</div>
      <div class="date-badge">
        <span id="todayDate">09.09</span>
        <small>周二</small>
      </div>
    </div>

    <div class="avatar-block">
      <img class="avatar-img" src="2.jpg" alt="张智杰" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23ffb8ce%22/%3E%3Ctext x=%2230%22 y=%2260%22 font-size=%2240%22 fill=%22%236d2a44%22 font-family=%22sans-serif%22%3E💙%3C/text%3E%3C/svg%3E'">
      <span>💪 智杰</span>
    </div>
  </div>

  <!-- 课表 -->
  <div class="schedule-box">
    <div class="schedule-title">
      <span class="day">📅 09月09日 · 周二</span>
      <span class="week">第2周 · 2026-2027 第1学期</span>
    </div>

    <!-- 5-6节 无人机制造与加工工艺 -->
    <div class="lesson-item">
      <div class="lesson-time">
        <span>5-6节</span> 14:30 - 16:05
      </div>
      <div class="lesson-name">
        <span class="icon-emoji">✈️</span> 无人机制造与加工工艺 ★
      </div>
      <div class="lesson-meta">
        <span>📍 天府校区 鸿鹄楼6025(中楼)</span>
        <i>👨‍🏫 张小强,付贵</i>
      </div>
    </div>

    <!-- 9-10节 大学体育5-羽毛球 -->
    <div class="lesson-item">
      <div class="lesson-time">
        <span>9-10节</span> 19:00 - 20:35
      </div>
      <div class="lesson-name">
        <span class="icon-emoji">🏸</span> 大学体育5-羽毛球 ◆
      </div>
      <div class="lesson-meta">
        <span>📍 天府校区1号运动场（天府）04</span>
        <i>👩‍🏫 夏春雨</i>
      </div>
    </div>

    <!-- 小彩蛋：明日课表预览 (09.10 周三) 保持浪漫 -->
    <div style="margin-top: 16px; padding-top: 6px; border-top: 2px dashed #ffb8ce; opacity: 0.8;">
      <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: #a04968; padding: 0 4px;">
        <span>🌸 明日预告 · 09.10 周三</span>
        <span>💕 待更新</span>
      </div>
      <div style="display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; font-size: 13px; color: #7a3b53; background: rgba(255,220,235,0.3); padding: 6px 12px; border-radius: 40px;">
        <span>📖 大学英语</span>
        <span>⚙️ 工程实训</span>
        <span>💬 爱你哟</span>
      </div>
    </div>
  </div>

  <!-- 底部爱意标语 -->
  <div class="footnote-love">
    <span>❤️</span> 每天想你  <small>·</small>  诗凡 & 智杰  <span>❤️</span>
  </div>
</div>

<!-- 音乐播放器 （浪漫BGM） 自动播放策略：用户手势后播放，点击按钮切换 -->
<div class="music-player" id="musicToggle" title="🎵 浪漫旋律">
  <span id="musicIcon">🎶</span>
</div>

<script>
  (function() {
    // ----- 日期显示：09.09 周二 -----
    const dateEl = document.getElementById('todayDate');
    if (dateEl) {
      // 直接显示固定日期 (9.9)
      dateEl.textContent = '09.09';
    }

    // ----- 背景音乐: 浪漫钢琴曲 (使用公开可用的音乐源) -----
    // 使用一个轻快浪漫的音频 (可替换)
    const audio = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3');
    audio.loop = true;
    audio.volume = 0.5; // 柔和的音量

    let isPlaying = false;
    const toggleBtn = document.getElementById('musicToggle');
    const iconSpan = document.getElementById('musicIcon');

    // 尝试自动播放 (部分浏览器限制，需要用户手势)
    function tryAutoPlay() {
      audio.play().then(() => {
        isPlaying = true;
        if (iconSpan) iconSpan.textContent = '🎵';
      }).catch(() => {
        // 自动播放失败，等待用户点击
        if (iconSpan) iconSpan.textContent = '🔇';
        isPlaying = false;
      });
    }

    // 页面加载尝试自动播放
    window.addEventListener('load', function() {
      tryAutoPlay();
    });

    // 用户点击切换 播放/暂停
    if (toggleBtn) {
      toggleBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
          if (iconSpan) iconSpan.textContent = '🔇';
        } else {
          audio.play().then(() => {
            isPlaying = true;
            if (iconSpan) iconSpan.textContent = '🎵';
          }).catch(() => {
            // 某些情况仍然无法播放
            isPlaying = false;
            if (iconSpan) iconSpan.textContent = '🔇';
          });
        }
      });
    }

    // 如果用户点击页面任何位置且音乐未播放，尝试恢复播放（提升体验）
    document.addEventListener('click', function() {
      if (!isPlaying && audio.paused) {
        audio.play().then(() => {
          isPlaying = true;
          if (iconSpan) iconSpan.textContent = '🎵';
        }).catch(() => {});
      }
    }, { once: false });

    // 保证头像加载失败时显示占位 (已内联onerror)
    // 额外处理: 若1.jpg/2.jpg不存在, 显示文字emoji
    console.log('💕 诗凡 & 智杰 · 专属课表 浪漫加载');
  })();
</script>

<!-- 注解：头像文件 1.jpg (陈诗凡) 和 2.jpg (张智杰) 请放在同目录下 -->
</body>
</html>
